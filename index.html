<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rhythm Game Option Simulator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app" class="app dock-side">
            <!-- 타이틀 바 -->
            <div id="title-bar" class="title-bar">
                <span class="app-name">Rhythm Game Option Simulator</span>
                <div class="title-actions">
                    <button type="button" class="title-btn" title="도움말">?</button>
                    <button type="button" class="title-btn" title="연락처">✉</button>
                </div>
            </div>

            <!-- 상단 바 -->
            <header id="top-bar" class="top-bar"></header>

            <!-- 프리뷰 영역 (모바일: 탭 패널보다 먼저 위치) -->
            <div id="preview-area" class="preview-area"></div>

            <!-- 옵션 패널 (데스크톱: 사이드/하단, 모바일: 상단 존 아래 상시 표시) -->
            <aside id="options-panel"></aside>

            <!-- 분석 패널 (데스크톱: 사이드 그리드, 모바일: 상단 존으로 이동) -->
            <aside id="analysis-panel"></aside>
        </div>

        <!-- 사이드바 백드롭 (태블릿 햄버거 오픈 시) -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- 모달 루트 -->
        <div id="modal-root"></div>

        <script type="module" src="main.js"></script>
    </body>
</html>
